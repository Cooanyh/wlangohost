<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-labelledby="title desc" style="color:#26364d">
  <title id="title">WlanGO</title>
  <desc id="desc">电脑与平板之间的双向直连</desc>

  <style>
    @media (prefers-color-scheme: dark) {
      svg { color: #edf4ff; }
      .link { stroke: #63dfcc; }
    }
  </style>

  <!-- 电脑 -->
  <rect x="8.5" y="18.5" width="24" height="20" rx="3.5" fill="none" stroke="currentColor" stroke-width="3"></rect>
  <path d="M6.5 43h28m-18 0 2.5-4.5m10 4.5-2.5-4.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>

  <!-- 平板 -->
  <rect x="42" y="14.5" width="13.5" height="29" rx="3.5" fill="none" stroke="currentColor" stroke-width="3"></rect>
  <circle cx="48.75" cy="38.5" r="1.25" fill="currentColor"></circle>

  <!-- 双向直连 -->
  <path class="link" d="M30 23.5h7m-2.5-2.5 2.5 2.5-2.5 2.5" fill="none" stroke="#07877f" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"></path>
  <path class="link" d="M39 37.5h-8m2.5-2.5L31 37.5l2.5 2.5" fill="none" stroke="#07877f" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>